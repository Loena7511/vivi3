<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    
    <!-- Запрет кэширования страницы -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>VivienneFairytaleMagic</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    
    <!-- Подключение VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">VivienneFairytaleMagic</div>
      </div>
    </div>

    <script>
      function notifyVK() {
        // 1. Отправка напрямую в родительский контейнер ВК по спецификации VK Connect
        if (window.parent && window.parent !== window) {
          var payload = {
            handler: 'VKWebAppInit',
            params: {},
            type: 'vk-connect'
          };
          window.parent.postMessage(payload, '*');
          try {
            window.parent.postMessage(JSON.stringify(payload), '*');
          } catch (e) {}
        }

        // 2. Вызов через VK Bridge, если библиотека загрузилась
        if (typeof vkBridge !== 'undefined' && vkBridge.send) {
          vkBridge.send('VKWebAppInit').catch(function() {});
        }
      }

      // Функция обработки покупок в ВК с гарантированным дублированием
      function vkShowOrderBox(itemId) {
        console.log('>>> [vkShowOrderBox] Запрос покупки товара:', itemId);

        var payload = {
          handler: 'VKWebAppShowOrderBox',
          params: {
            type: 'item',
            item: itemId
          },
          type: 'vk-connect'
        };

        // Вызов через VK Bridge
        if (typeof vkBridge !== 'undefined' && vkBridge.send) {
          vkBridge.send('VKWebAppShowOrderBox', {
            type: 'item',
            item: itemId
          }).then(function(data) {
            console.log('Успешная покупка:', data);
          }).catch(function(error) {
            console.error('Ошибка покупки VK Bridge:', error);
          });
        } else {
          console.warn('vkBridge не найден на странице!');
        }

        // Дублирующий вызов через postMessage прямо в фрейм ВК
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
          try {
            window.parent.postMessage(JSON.stringify(payload), '*');
          } catch (e) {}
        }
      }

      // Запуск отправки сигнала при старте и каждые 300 мс до завершения загрузки
      notifyVK();
      var initInterval = setInterval(notifyVK, 300);

      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/vivienne-game.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/vivienne-game.data",
        frameworkUrl: buildUrl + "/vivienne-game.framework.js",
        codeUrl: buildUrl + "/vivienne-game.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "VivienneFairytaleMagic",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          
          notifyVK();
          setTimeout(function() {
            clearInterval(initInterval);
          }, 4000);

          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
