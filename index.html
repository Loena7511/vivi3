<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <title>VivienneFairytaleMagic</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">VivienneFairytaleMagic</div>
      </div>
    </div>

    <script>
      var currentPurchasingItem = '';
      var isPaymentProcessed = false;

      // Функция единичного начисления награды
      function sendRewardToUnity(itemId, source) {
        if (isPaymentProcessed) {
          console.log('>>> [' + source + '] Повторный сигнал проигнорирован (награда уже выдана)');
          return;
        }

        var finalItem = itemId || currentPurchasingItem;
        if (!finalItem) return;

        isPaymentProcessed = true; // Замок закрывается с первого вызова

        console.log('>>> [' + source + '] Начисление награды в Unity (строго 1 раз):', finalItem);
        if (window.unityInstance) {
          window.unityInstance.SendMessage('GameManager', 'GiveRewardByVKId', finalItem);
        } else {
          console.error('>>> Ошибка: unityInstance не найден!');
        }
      }

      // Инициализация VK Bridge
      if (typeof vkBridge !== 'undefined') {
        vkBridge.send('VKWebAppInit');

        vkBridge.subscribe(function(e) {
          if (!e || !e.detail) return;
          var type = e.detail.type;
          var data = e.detail.data;

          if (type === 'VKWebAppShowOrderBoxResult') {
            var itemId = (data && data.item) || currentPurchasingItem;
            sendRewardToUnity(itemId, 'VK Bridge Subscribe');
          }
        });
      }

      // Подстраховка через postMessage
      window.addEventListener('message', function(event) {
        if (!event.data) return;
        var data = event.data;
        if (typeof data === 'string') {
          try { data = JSON.parse(data); } catch(e) {}
        }
        var type = data.type || (data.detail && data.detail.type) || data.handler;
        if (type === 'VKWebAppShowOrderBoxResult') {
          sendRewardToUnity(currentPurchasingItem, 'postMessage');
        }
      });

      // Вызов окна покупки
      function vkShowOrderBox(itemId) {
        console.log('>>> [vkShowOrderBox] Старт покупки товара:', itemId);
        currentPurchasingItem = itemId;
        isPaymentProcessed = false; // Открываем замок только для НОВОЙ покупки

        if (typeof vkBridge !== 'undefined' && vkBridge.send) {
          vkBridge.send('VKWebAppShowOrderBox', {
            type: 'item',
            item: itemId
          }).then(function(data) {
            var targetItem = itemId || (data && data.item);
            sendRewardToUnity(targetItem, 'VK Bridge Promise');
          }).catch(function(err) {
            console.error('>>> Ошибка оплаты в VK Bridge:', err);
          });
        }
      }

      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/vivienne-game.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/vivienne-game.data",
        frameworkUrl: buildUrl + "/vivienne-game.framework.js",
        codeUrl: buildUrl + "/vivienne-game.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "VivienneFairytaleMagic",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          window.unityInstance = unityInstance;

          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => { alert(message); });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
